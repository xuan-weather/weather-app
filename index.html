<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣氣象地圖（雨量與氣溫）</title>
  
  <!-- 載入 Leaflet 地圖套件 CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; }
    
    header {
      padding: 15px; text-align: center; background: #1f2937; display: flex;
      flex-direction: column; align-items: center; gap: 10px;
    }
    .btn-group button {
      padding: 8px 16px; font-size: 15px; font-weight: bold; border: none;
      border-radius: 20px; cursor: pointer; margin: 0 5px; background: #374151; color: #ccc;
    }
    .btn-group button.active { background: #3b82f6; color: #fff; }

    /* 地圖容器 */
    #map { width: 100vw; height: calc(100vh - 80px); }

    /* 地圖標籤圖示樣式 */
    .weather-badge {
      display: flex; justify-content: center; align-items: center;
      width: 40px; height: 40px; border-radius: 50%; color: white;
      font-weight: bold; font-size: 13px; border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5); text-shadow: 0 1px 2px #000;
    }
  </style>
</head>
<body>

  <header>
    <h2>🗺️ 台灣即時氣象圖層</h2>
    <div class="btn-group">
      <button id="btnTemp" class="active" onclick="switchMode('temp')">🌡️ 氣溫分佈</button>
      <button id="btnRain" onclick="switchMode('rain')">🌧️ 日累積雨量</button>
    </div>
  </header>

  <div id="map"></div>

  <!-- 載入 Leaflet 地圖套件 JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ⚠️ 請填入你的中央氣象署 API Key
    const CWA_API_KEY = "CWA-8BC01589-C3CD-4A80-9A3B-1AFA46E9F246";

    let map;
    let currentMode = 'temp'; // 'temp' 或 'rain'
    let weatherData = [];
    let markersLayer = L.layerGroup();

    // 初始化 Leaflet 地圖（以台灣中心點為基準）
    function initMap() {
      map = L.map('map').setView([23.7, 120.95], 8);

      // 使用 OpenStreetMap 免費地圖底圖 (暗色系風格)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);

      markersLayer.addTo(map);
      fetchWeatherData();
    }

    // 從中央氣象署 API 取得自動氣象站觀測資料 (O-A0001-001)
    async function fetchWeatherData() {
      const url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/O-A0001-001?Authorization=${CWA_API_KEY}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        weatherData = data.records.Station;
        renderMarkers();
      } catch (err) {
        console.error("無法取得氣象資料:", err);
      }
    }

    // 計算溫度顏色 (冷藍到熱紅)
    function getTempColor(t) {
      if (t <= 15) return '#3b82f6'; // 藍
      if (t <= 22) return '#10b981'; // 綠
      if (t <= 28) return '#f59e0b'; // 黃
      if (t <= 32) return '#f97316'; // 橘
      return '#ef4444';              // 紅
    }

    // 計算雨量顏色 (無雨到超大豪雨)
    function getRainColor(r) {
      if (r <= 0) return '#6b7280';  // 無雨（灰）
      if (r < 15) return '#60a5fa';  // 小雨（淺藍）
      if (r < 50) return '#2563eb';  // 中雨（藍）
      if (r < 130) return '#eab308'; // 大雨（黃）
      return '#dc2626';              // 豪雨（紅）
    }

    // 渲染地圖上的氣象點位
    function renderMarkers() {
      markersLayer.clearLayers();

      weatherData.forEach(station => {
        const lat = parseFloat(station.GeoInfo.Coordinates.find(c => c.CoordinateName === "WGS84").StationLatitude);
        const lng = parseFloat(station.GeoInfo.Coordinates.find(c => c.CoordinateName === "WGS84").StationLongitude);
        const temp = parseFloat(station.WeatherElement.AirTemperature);
        const rain = parseFloat(station.WeatherElement.Now.Precipitation);

        // 過濾無效資料
        if (isNaN(lat) || isNaN(lng)) return;

        let valText = '--';
        let bgColor = '#6b7280';

        if (currentMode === 'temp') {
          if (temp > -50) {
            valText = `${Math.round(temp)}°`;
            bgColor = getTempColor(temp);
          }
        } else {
          if (rain >= 0) {
            valText = rain === 0 ? '0' : rain.toFixed(1);
            bgColor = getRainColor(rain);
          }
        }

        // 自訂 Leaflet 圖示
        const customIcon = L.divIcon({
          className: 'custom-icon',
          html: `<div class="weather-badge" style="background:${bgColor};">${valText}</div>`,
          iconSize: [40, 40],
          iconAnchor: [20, 20]
        });

        const marker = L.marker([lat, lng], { icon: customIcon });
        
        // 點擊顯示詳細資訊氣泡
        marker.bindPopup(`
          <div style="color:#000;">
            <h4 style="margin-bottom:5px;">${station.StationName}（${station.GeoInfo.CountyName}）</h4>
            <p>🌡️ 目前氣溫：<b>${temp > -50 ? temp + ' °C' : '無資料'}</b></p>
            <p>🌧️ 日累積雨量：<b>${rain >= 0 ? rain + ' mm' : '無資料'}</b></p>
            <p>💧 相對濕度：<b>${station.WeatherElement.RelativeHumidity}%</b></p>
          </div>
        `);

        markersLayer.addLayer(marker);
      });
    }

    // 切換 氣溫 / 雨量 模式
    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btnTemp').classList.toggle('active', mode === 'temp');
      document.getElementById('btnRain').classList.toggle('active', mode === 'rain');
      renderMarkers();
    }

    // 網頁載入完成後啟動地圖
    window.onload = initMap;
  </script>
</body>
</html>
