<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全台天氣即時預報與溫度趨勢圖</title>
    <!-- 載入 Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; color: #fff; }
        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; padding: 25px; width: 100%; max-width: 550px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; font-weight: 600; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .select-group { flex: 1; }
        label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 8px; }
        select { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; font-size: 1rem; color: #fff; outline: none; cursor: pointer; }
        optgroup { background: #1e293b; color: #38bdf8; font-weight: bold; }
        option { background: #0f172a; color: #fff; }
        
        .locate-btn { display: flex; align-items: flex-end; }
        .locate-btn button { padding: 12px 16px; background: #0284c7; color: white; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .locate-btn button:hover { background: #0369a1; }

        .chart-container { background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 15px; margin-bottom: 20px; position: relative; height: 230px; }

        .forecast-list { display: flex; flex-direction: column; gap: 12px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
        .forecast-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 15px; }
        
        .time-tag { font-size: 0.85rem; color: #38bdf8; font-weight: bold; margin-bottom: 8px; }
        .weather-main { display: flex; justify-content: space-between; align-items: center; }
        .wx-box { display: flex; align-items: center; gap: 8px; }
        .weather-icon { font-size: 1.6rem; }
        .wx-title { font-size: 1rem; font-weight: bold; color: #f8fafc; }
        .temp-range { font-size: 1.2rem; font-weight: 700; color: #f1f5f9; }

        .status { text-align: center; color: #94a3b8; margin-bottom: 15px; font-size: 0.85rem; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌤️ 全台氣象與溫度趨勢圖</h1>
        
        <div class="controls">
            <div class="select-group">
                <label for="citySelect">選擇縣市</label>
                <select id="citySelect" onchange="fetchWeatherForSelectedCity()">
                    <!-- 動態由 JavaScript 生成選單 -->
                </select>
            </div>
            <div class="locate-btn">
                <button onclick="getUserLocation()">🎯 自動定位</button>
            </div>
        </div>

        <div id="status" class="status">正在取得天氣資料...</div>

        <!-- Chart.js 畫布容器 -->
        <div class="chart-container">
            <canvas id="tempChart"></canvas>
        </div>

        <div id="weatherList" class="forecast-list"></div>
    </div>

    <script>
        // 全台主要縣市及其經緯度資訊 (不需要任何 API Key)
        const CITIES = {
            "北部地區": [
                { name: "臺北市", lat: 25.0330, lon: 121.5654 },
                { name: "新北市", lat: 25.0117, lon: 121.4658 },
                { name: "基隆市", lat: 25.1283, lon: 121.7419 },
                { name: "桃園市", lat: 24.9936, lon: 121.3010 },
                { name: "新竹市", lat: 24.8138, lon: 120.9675 },
                { name: "新竹縣", lat: 24.8387, lon: 121.0177 },
                { name: "苗栗縣", lat: 24.5601, lon: 120.8214 }
            ],
            "中部地區": [
                { name: "臺中市", lat: 24.1477, lon: 120.6736 },
                { name: "彰化縣", lat: 24.0518, lon: 120.5161 },
                { name: "南投縣", lat: 23.9037, lon: 120.6859 },
                { name: "雲林縣", lat: 23.7092, lon: 120.4313 }
            ],
            "南部地區": [
                { name: "嘉義市", lat: 23.4800, lon: 120.4491 },
                { name: "嘉義縣", lat: 23.4588, lon: 120.2928 },
                { name: "臺南市", lat: 22.9997, lon: 120.2270 },
                { name: "高雄市", lat: 22.6273, lon: 120.3014 },
                { name: "屏東縣", lat: 22.6717, lon: 120.4879 }
            ],
            "東部地區": [
                { name: "宜蘭縣", lat: 24.7570, lon: 121.7530 },
                { name: "花蓮縣", lat: 23.9871, lon: 121.6016 },
                { name: "臺東縣", lat: 22.7613, lon: 121.1444 }
            ],
            "離島地區": [
                { name: "澎湖縣", lat: 23.5711, lon: 119.5793 },
                { name: "金門縣", lat: 24.4493, lon: 118.3768 },
                { name: "連江縣", lat: 26.1505, lon: 119.9499 }
            ]
        };

        let tempChart = null;

        // 初始化選單
        function initDropdown() {
            const select = document.getElementById('citySelect');
            select.innerHTML = '';

            for (const [region, cityList] of Object.entries(CITIES)) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = `📍 ${region}`;

                cityList.forEach(city => {
                    const option = document.createElement('option');
                    option.value = JSON.stringify(city);
                    option.innerText = city.name;
                    optgroup.appendChild(option);
                });

                select.appendChild(optgroup);
            }
        }

        // 天氣代碼轉換為圖示與說明
        function parseWeatherCode(code) {
            if (code === 0) return { icon: "☀️", text: "晴朗" };
            if (code >= 1 && code <= 3) return { icon: "⛅", text: "多雲/局部有雲" };
            if (code >= 45 && code <= 48) return { icon: "🌫️", text: "有霧" };
            if (code >= 51 && code <= 67) return { icon: "🌧️", text: "毛毛雨/陣雨" };
            if (code >= 80 && code <= 82) return { icon: "🌧️", text: "強陣雨" };
            if (code >= 95) return { icon: "⛈️", text: "雷陣雨" };
            return { icon: "🌤️", text: "多雲" };
        }

        // 抓取指定縣市的天氣資料
        async function fetchWeatherForSelectedCity() {
            const select = document.getElementById('citySelect');
            const statusDiv = document.getElementById('status');
            
            if (!select.value) return;

            const city = JSON.parse(select.value);
            statusDiv.className = 'status';
            statusDiv.innerText = `正在讀取 ${city.name} 的預報資料...`;

            // 免費且不需要 Key 的 API 網址
            const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FTaipei`;

            try {
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error("資料抓取失敗");

                const data = await res.json();
                statusDiv.innerText = '';
                
                renderWeather(data.daily);
            } catch (err) {
                statusDiv.className = 'status error';
                statusDiv.innerText = "無法取得天氣資料，請檢查網路狀態。";
            }
        }

        // 渲染列表與更新 Chart.js 折線圖
        function renderWeather(daily) {
            const container = document.getElementById('weatherList');
            container.innerHTML = '';

            const dates = daily.time;
            const maxTemps = daily.temperature_2m_max;
            const minTemps = daily.temperature_2m_min;
            const weatherCodes = daily.weathercode;

            const labels = [];

            for (let i = 0; i < dates.length; i++) {
                const dateStr = dates[i].substring(5); // 取得 MM-DD 格式
                labels.push(dateStr);

                const weather = parseWeatherCode(weatherCodes[i]);
                const card = document.createElement('div');
                card.className = 'forecast-card';
                card.innerHTML = `
                    <div class="time-tag">📅 ${dates[i]}</div>
                    <div class="weather-main">
                        <div class="wx-box">
                            <span class="weather-icon">${weather.icon}</span>
                            <span class="wx-title">${weather.text}</span>
                        </div>
                        <span class="temp-range">${Math.round(minTemps[i])}° - ${Math.round(maxTemps[i])}°C</span>
                    </div>
                `;
                container.appendChild(card);
            }

            updateChart(labels, minTemps, maxTemps);
        }

        // 繪製/更新 Chart.js 圖表
        function updateChart(labels, minTemps, maxTemps) {
            const ctx = document.getElementById('tempChart').getContext('2d');

            if (tempChart) {
                tempChart.destroy(); // 銷毀舊圖表，防止重疊
            }

            tempChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '最高溫 (°C)',
                            data: maxTemps,
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.15)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '最低溫 (°C)',
                            data: minTemps,
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56, 189, 248, 0.15)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#cbd5e1', font: { size: 12 } }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#94a3b8' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        },
                        y: {
                            ticks: { color: '#94a3b8' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        }
                    }
                }
            });
        }

        // 自動定位功能
        function getUserLocation() {
            const statusDiv = document.getElementById('status');
            if (!navigator.geolocation) {
                fetchWeatherForSelectedCity();
                return;
            }

            statusDiv.className = 'status';
            statusDiv.innerText = '🔍 正在自動定位...';

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    try {
                        const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
                        const geoData = await res.json();
                        let detectedCity = geoData.principalSubdivision || geoData.city || "";
                        detectedCity = detectedCity.replace("台", "臺");

                        selectNearestCity(detectedCity);
                    } catch (err) {
                        fetchWeatherForSelectedCity();
                    }
                },
                () => { fetchWeatherForSelectedCity(); },
                { timeout: 8000 }
            );
        }

        function selectNearestCity(cityName) {
            const select = document.getElementById('citySelect');
            let foundOptionValue = null;

            for (const option of select.options) {
                if (option.value) {
                    const city = JSON.parse(option.value);
                    if (cityName.includes(city.name) || city.name.includes(cityName)) {
                        foundOptionValue = option.value;
                        break;
                    }
                }
            }

            if (foundOptionValue) {
                select.value = foundOptionValue;
            }

            fetchWeatherForSelectedCity();
        }

        // 頁面載入初始化
        initDropdown();
        getUserLocation();
    </script>
</body>
</html>
