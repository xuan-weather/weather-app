<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣氣象預報</title>
  <style>
    body { font-family: sans-serif; background: #38bdf8; color: #fff; padding: 20px; text-align: center; }
    .card { background: rgba(255,255,255,0.2); padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 400px; }
    input, button { padding: 10px; border-radius: 6px; border: none; font-size: 16px; margin: 5px; }
    button { background: #0284c7; color: white; cursor: pointer; }
  </style>
</head>
<body>

  <h1>🌤️ 台灣天氣觀測站</h1>

  <div class="card">
    <input type="text" id="cityInput" placeholder="輸入縣市（例如：臺北市）" value="臺北市">
    <button onclick="getWeather()">查詢</button>
    <div id="result">
      <h2 id="cityName">--</h2>
      <p id="temp">--°C</p>
      <p id="wx">--</p>
      <p id="pop">降雨機率：--%</p>
    </div>
  </div>

  <script>
    // ⚠️ 請將下方替換為你在氣象署申請到的 API 金鑰
    const CWA_API_KEY = "YOUR_CWA_API_KEY";

    async function getWeather() {
      let location = document.getElementById("cityInput").value.trim();
      // 處理「台」與「臺」的格式轉換
      location = location.replace("台", "臺");

      const url = `https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=${CWA_API_KEY}&locationName=${encodeURIComponent(location)}`;

      try {
        const response = await fetch(url);
        const data = await response.json();
        const locationData = data.records.location[0];

        if (!locationData) {
          alert("找不到該縣市資料，請輸入完整縣市名稱（例如：臺南市、臺北市）");
          return;
        }

        const weatherElements = locationData.weatherElement;
        const wx = weatherElements.find(e => e.elementName === "Wx").time[0].parameter.parameterName;
        const pop = weatherElements.find(e => e.elementName === "PoP").time[0].parameter.parameterName;
        const minT = weatherElements.find(e => e.elementName === "MinT").time[0].parameter.parameterName;
        const maxT = weatherElements.find(e => e.elementName === "MaxT").time[0].parameter.parameterName;

        document.getElementById("cityName").innerText = locationData.locationName;
        document.getElementById("temp").innerText = `${minT}°C - ${maxT}°C`;
        document.getElementById("wx").innerText = `🌤️ ${wx}`;
        document.getElementById("pop").innerText = `☔ 降雨機率：${pop}%`;

      } catch (error) {
        console.error(error);
        alert("取得資料失敗，請檢查 API Key 是否填寫正確！");
      }
    }

    // 初始化載入
    getWeather();
  </script>
</body>
</html>
